name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # pixi.toml only targets osx-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true
      - run: pixi run pytest -q --cov=align_crystal --cov-report=term-missing --cov-report=xml
      - name: Coverage in job summary
        run: pixi run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
