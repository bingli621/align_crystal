name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # pixi.toml only targets osx-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true
      - run: pixi run pytest -q
