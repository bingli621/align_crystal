name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true
      - run: pixi run pytest -q --cov=mcstas_to_sqe --cov-report=term-missing
      - name: Coverage in job summary
        run: pixi run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
