[workspace]
authors = ["Bing Li <bing.li@ess.eu>"]
channels = ["conda-forge"]
name = "mcstas_to_sqe"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
mcstas = ">=3.9.1,<4"
mcstasscript = ">=0.0.94,<0.0.95"
