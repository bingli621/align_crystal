# Default diffractometer configuration. Your own config file only needs the keys it changes
# (see file_io/loader.py: load_config); null means "derive it" (see __post_init__ of the components and of Diffractometer) or "not applicable".
name: align_crystal_diffractometer   # McStas instrument name

# One section per McStas component (its class in components.py is named after it); the key is
# its instance name in McStas and the role the code refers to it by, the rest its parameters.
# Add `name: other` to give it a different McStas instance name than its key.
origin: {}

source:
  energy_meV: 14
  wavelength: null     # angstrom, monochromatic; null = derive from energy_meV
  radius: 0.03         # m
  dist: null           # source -> focus plane, m; null = sample_pos distance
  flux: 1.0e10

slit1:
  size: 0.01           # opening and source focus (x and y), m

incident_monitor: {}   # integrated incident intensity; the neutrons carry on

sample_pos: {}         # the beam hits the goniometer centre; the beam can be dumped here

# Goniometer arms, outermost first. `angle` (deg) is the initial value of the McStas parameter
# named after the arm without "gonio_" (omega, chi, phi), so it can be scanned.
gonio_omega:
  angle: 0.0           # rotation about +Y
gonio_chi:
  angle: 0.0           # rotation about -Z
gonio_phi:
  angle: 0.0           # rotation about +X

crystal:
  size: 0.005          # cube edge, m
  order: 1             # single scattering only (no multiple scattering): much faster

detector:              # cylindrical ("banana") detector around the vertical axis through the sample
  radius: 1.0          # m
  height: 0.5          # m
  two_theta_range: [-125.0, -5.0]   # deg, signed: negative = right of the beam
  n_theta: 1200
  n_y: 50

# McStas AT (m) and ROTATED (deg; numbers or parameter names), keyed by the same roles.
# `relative` is the RELATIVE reference of both, given as a role (null = absolute).
placements:
  origin:           {at: [0, 0, 0],   rotated: null,            relative: null}
  source:           {at: [0, 0, 0],   rotated: null,            relative: origin}
  slit1:            {at: [0, 0, 1.0], rotated: null,            relative: source}
  incident_monitor: {at: [0, 0, 1.9], rotated: null,            relative: source}  # 10 cm before the sample
  sample_pos:       {at: [0, 0, 2.0], rotated: null,            relative: source}
  gonio_omega:      {at: [0, 0, 0],   rotated: [0, omega, 0],   relative: sample_pos}
  gonio_chi:        {at: [0, 0, 0],   rotated: [0, 0, "-chi"],  relative: gonio_omega}
  gonio_phi:        {at: [0, 0, 0],   rotated: [phi, 0, 0],     relative: gonio_chi}
  crystal:          {at: [0, 0, 0],   rotated: null,            relative: gonio_phi}
  detector:         {at: [0, 0, 0],   rotated: null,            relative: sample_pos}
