# The diffractometer made in code (instrument/diffractometer.py), saved: a reference of how a
# parameters file looks. A file you load with load(path) (yaml_io.py) names its instrument and is
# laid over the one the code makes, so it need hold only what differs: a value it gives wins, one
# it leaves out or sets to null stays as made.
instrument: SingleCrystalDiffractometer  # the instrument class (instrument/diffractometer.py)
name: single_crystal_diffractometer      # McStas instrument name

# The params of the diffractometer, each with its value, unit and comment (from the metadata of
# Params). A unit, if given, must be the one in the code; the comment is only for reading; a bare
# number stands for the value (ei: 25). McStas gets them as its instrument parameters (calculated,
# not saved): the wavelength of ei, and the goniometer angles, unless a run gives its own. Where a
# component takes a number it may name one of these instead (or an expression of them, "-chi"), as
# in McStas.
params:
  ei:    {value: 14.0, unit: meV, comment: incident energy}
  omega: {value: 0.0, unit: deg, comment: goniometer rotation about +Y}
  chi:   {value: 0.0, unit: deg, comment: goniometer rotation about -Z}
  phi:   {value: 0.0, unit: deg, comment: goniometer rotation about +X}

# One section per component name, in the order of the beam: the order in which the components are
# built (a component can only be relative to one before it). Each has its `component` (the McStas
# component, the class of the same name in instrument/components/), its parameters, and where it
# sits: McStas AT (m), ROTATED (deg; numbers or instrument parameter names) and RELATIVE (a
# component name; null = absolute). The name is also the instance name in McStas.
# Last, `position` is where it is in the lab frame (m), calculated from those with the params'
# angles: written for reading, never read back.
origin:
  component: Progress_bar
  at: [0, 0, 0]
  rotated: [0, 0, 0]
  relative: null
  position: [0.0, 0.0, 0.0]

source:                # monochromatic
  component: Source_simple
  lambda0: wavelength  # angstrom: the instrument parameter, calculated from ei unless a run sets it
  radius: 0.03         # m
  focus_on: sample_pos # the component the source focuses on, at its distance
  flux: 1.0e+10        # PyYAML needs the sign: 1.0e10 would load as a string
  at: [0, 0, 0]
  rotated: [0, 0, 0]
  relative: origin
  position: [0.0, 0.0, 0.0]

slit:
  component: Slit
  xwidth: 0.01         # opening and source focus, m
  yheight: 0.01
  at: [0, 0, 1.0]
  rotated: [0, 0, 0]
  relative: source
  position: [0.0, 0.0, 1.0]

incident_monitor:      # integrated incident intensity; the neutrons carry on
  component: Monitor
  at: [0, 0, 0.9]      # 10 cm before the sample
  rotated: [0, 0, 0]
  relative: slit
  position: [0.0, 0.0, 1.9]

sample_pos:            # the beam hits the goniometer centre; the beam can be dumped here
  component: Arm
  at: [0, 0, 0.1]
  rotated: [0, 0, 0]
  relative: incident_monitor
  position: [0.0, 0.0, 2.0]

# Goniometer arms, outermost first, each rotated by an instrument parameter, so it can be scanned.
gonio_omega:
  component: Arm
  at: [0, 0, 0]
  rotated: [0, omega, 0]    # about +Y
  relative: sample_pos
  position: [0.0, 0.0, 2.0]
gonio_chi:
  component: Arm
  at: [0, 0, 0]
  rotated: [0, 0, "-chi"]   # about -Z
  relative: gonio_omega
  position: [0.0, 0.0, 2.0]
gonio_phi:
  component: Arm
  at: [0, 0, 0]
  rotated: [phi, 0, 0]      # about +X
  relative: gonio_chi
  position: [0.0, 0.0, 2.0]

# A cube of a single crystal: here aluminium (aluminum() in instrument/samples/), its cubic axes
# along the lab axes.
sample:
  component: Single_crystal
  # a, b, c (angstrom), alpha, beta, gamma (deg)
  lattice_params: [4.0495, 4.0495, 4.0495, 90.0, 90.0, 90.0]
  along_beam: [0, 0, 1]   # hkl along the beam (+z) when all goniometer angles are zero
  in_plane: [1, 0, 0]     # hkl in the horizontal plane, towards +x (left of the beam)
  reflections: Al.lau   # a McStas reflection list, or a CIF file
  xwidth: 0.005        # m: a cube
  yheight: 0.005
  zdepth: 0.005
  order: 1             # single scattering only (no multiple scattering): much faster
  mosaic: 5.0         # arc minutes (Gaussian RMS)
  at: [0, 0, 0]
  rotated: [0, 0, 0]
  relative: gonio_phi
  position: [0.0, 0.0, 2.0]

detector:              # cylindrical ("banana") detector around the vertical axis through the sample
  component: Monitor_nD
  radius: 1.0          # m
  yheight: 0.5         # m
  two_theta_range: [-125.0, -5.0]   # deg, signed: negative = right of the beam
  n_theta: 1200
  n_y: 50
  at: [0, 0, 0]
  rotated: [0, 0, 0]
  relative: sample_pos
  position: [0.0, 0.0, 2.0]
